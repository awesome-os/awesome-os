# Awesome-OS Holo-Linux 7.3.6 — Limine v11/v12 Dual-Slot Bootloader Config
# Guarantees zero-flicker UEFI GOP -> SimpleDRM -> Sectium Canvas handoff.

timeout: 3
serial: yes
graphics: yes
interface_branding: Awesome-OS Holo-Linux 7.3.6 (v11 CAS)
interface_branding_colour: 6

# Uncompressed 24-bit BI_RGB BMP generated by assets/generate-splash.mts
wallpaper: boot():/boot/splash/awesome-os-1920x1080.bmp
wallpaper_style: stretched
backdrop: 0E1116

# Neutral Graphite + Lumi Cyan palette (matches Host Manager & Sectium)
term_background: 0E1116
term_foreground: E6EDF3
term_palette: 0E1116;F85149;3FB950;D29922;58A6FF;BC8CFF;39C5CF;E6EDF3
term_palette_bright: 484F58;FF7B72;56D364;E3B341;79C0FF;D2A8FF;56D4DD;FFFFFF

/Awesome-OS Holo-Linux 7.3.6 — Slot A (Zero-Flicker Desktop)
    protocol: linux
    kernel_path: boot():/boot/slot-a/vmlinuz
    cmdline: quiet splash loglevel=3 vt.global_cursor_default=0 fbcon=nodefer b8g.abi=v3 scx_holo=1 b8g.slot=a
    module_path: boot():/boot/slot-a/initramfs.cpio.zst

/Awesome-OS Holo-Linux 7.3.6 — Slot B (Atomic Rollback)
    protocol: linux
    kernel_path: boot():/boot/slot-b/vmlinuz
    cmdline: quiet splash loglevel=3 vt.global_cursor_default=0 fbcon=nodefer b8g.abi=v3 scx_holo=1 b8g.slot=b
    module_path: boot():/boot/slot-b/initramfs.cpio.zst

/Awesome-OS Holo-Linux 7.3.6 — Diagnostic Dual Console (QEMU / Proxmox / Hyper-V)
    protocol: linux
    kernel_path: boot():/boot/slot-a/vmlinuz
    cmdline: console=ttyS0,115200 console=tty0 b8g.abi=v3 scx_holo=1
    module_path: boot():/boot/slot-a/initramfs.cpio.zst

/Awesome-OS Holo-Linux 7.3.6 — CI Self-Test
    protocol: linux
    kernel_path: boot():/boot/slot-a/vmlinuz
    cmdline: console=ttyS0,115200 quiet b8g.abi=v3 scx_holo=1 awesome.selftest=1 t2.selftest=1
    module_path: boot():/boot/slot-a/initramfs.cpio.zst
