name: Release — Publish Pure CAS v11 AwesomeOS Bundle & Shards

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create/update on awesome-os/awesome-os'
        required: false
        default: 'cas-v11-latest'

permissions:
  contents: write

jobs:
  publish-cas-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build native C11/C++20 AwesomeOS Core Binaries & Splash BMPs
        run: |
          mkdir -p dist/cas-v11
          node os/bootloader/assets/generate-splash.mts
          cp os/bootloader/assets/splash/awesome-os-1920x1080.bmp dist/cas-v11/
          cp os/bootloader/assets/splash/awesome-os-splash.svg dist/cas-v11/
          cp os/shell/awesomeos-shell.html dist/cas-v11/

          cc -std=c11 -O3 -Wall -Wextra -Werror os/kernel/b8g_abi/b8g_abi_selftest.c -o dist/cas-v11/b8g_abi_selftest-linux-x64
          cc -std=c11 -O3 -Wall -Wextra -Werror os/bootloader/uefi-gop-splash/holo_splash.c os/bootloader/uefi-gop-splash/holo_splash_test.c -o dist/cas-v11/holo_splash_test-linux-x64
          g++ -std=c++20 -O3 -Wall -Wextra -Werror deployment/local-cpp/vdm_local.cpp -o dist/cas-v11/vdm-local-linux-x64

      - name: Stamp Ed25519 + SHA-512 Signed cas-v11-release-manifest.json
        run: |
          node --input-type=module -e "
            import { createHash } from 'node:crypto';
            import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
            import { join } from 'node:path';
            import { signManifestEd25519 } from './security/verified-boot.mts';

            const dir = 'dist/cas-v11';
            const entries = readdirSync(dir).sort().map((name) => {
              const buf = readFileSync(join(dir, name));
              const sha512 = createHash('sha512').update(buf).digest('hex');
              return { name, bytes: buf.byteLength, sha512, casPath: 'v11/files/' + sha512.slice(0, 2) + '/' + sha512 };
            });
            const signed = signManifestEd25519({
              schema: 'awesomeos.cas-v11-release.v1',
              abiMagic: '0x33564742',
              casLayout: 'v11',
              generatedAt: new Date().toISOString(),
              entries,
            });
            writeFileSync(join(dir, 'cas-v11-release-manifest.json'), JSON.stringify(signed, null, 2) + '\n');
            console.log('Signed', entries.length, 'CAS v11 artifacts with key', signed.signature.keyId);
          "
          (cd dist/cas-v11 && sha512sum * > SHA512SUMS.txt)

      - name: Publish to GitHub Releases (awesome-os/awesome-os)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
              *) TAG="cas-v11-latest" ;;
            esac
          fi
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/cas-v11/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" dist/cas-v11/* -R "${{ github.repository }}" \
              --title "AwesomeOS Pure CAS v11 Release (${TAG})" \
              --notes "Pure SHA-512 + Ed25519 signed CAS v11 release built directly from the AwesomeOS ChromeOS-model monorepo (zero legacy cas-v1 / b8g-ghost)."
          fi
